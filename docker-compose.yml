services:
  # Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: data-cataloger-neo4j
    ports:
      - "7474:7474" # HTTP browser interface
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - cataloger-net

  # PostgreSQL Sample Database (Northwind)
  postgres:
    image: postgres:15
    container_name: data-cataloger-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: northwind
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d northwind" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cataloger-net

  # Data Cataloger Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-cataloger-web
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      DATABASE_NAME: northwind
      PYTHONUNBUFFERED: "1"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cataloger-net

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:


networks:
  cataloger-net:
    driver: bridge
