<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cataloging - Data Cataloger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/cytoscape@3.30.0/dist/cytoscape.min.js"></script>
    <style>
        #live-graph {
            width: 100%;
            height: 600px;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            background: #f9fafb;
        }
        .sensitivity-pii { background-color: #ef4444; }
        .sensitivity-financial { background-color: #f59e0b; }
        .sensitivity-internal { background-color: #3b82f6; }
        .sensitivity-public { background-color: #22c55e; }
        
        .table-card {
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">
    <header class="bg-indigo-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Live Cataloging</h1>
            <nav>
                <a href="/" class="px-4 hover:text-indigo-200">← Back to Catalog</a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto p-4">
        <!-- Control Panel -->
        <div class="bg-white rounded-lg shadow p-4 mb-4">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-semibold">Database Cataloging</h2>
                    <p class="text-gray-600 text-sm">Watch tables appear in real-time as they are cataloged</p>
                </div>
                <div class="flex gap-4">
                    <button id="start-btn" 
                        class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
                        Start Cataloging
                    </button>
                    <button id="reset-btn" 
                        class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-600 transition">
                        Reset
                    </button>
                </div>
            </div>
            
            <!-- Progress Bar -->
            <div id="progress-section" class="mt-4 hidden">
                <div class="flex justify-between text-sm text-gray-600 mb-1">
                    <span id="progress-text">Processing...</span>
                    <span id="progress-count">0 / 0</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div id="progress-bar" class="bg-indigo-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <!-- Graph Panel -->
            <div class="lg:col-span-2 bg-white rounded-lg shadow p-4">
                <h3 class="text-lg font-semibold mb-2">Relationship Graph</h3>
                <div id="live-graph"></div>
            </div>

            <!-- Table List Panel -->
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="text-lg font-semibold mb-2">Cataloged Tables</h3>
                <div id="table-list" class="space-y-2 max-h-[600px] overflow-y-auto">
                    <p class="text-gray-500 text-center py-8">
                        Click "Start Cataloging" to begin
                    </p>
                </div>
            </div>
        </div>

        <!-- Detail Modal -->
        <div id="detail-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-[80vh] overflow-y-auto">
                <div class="p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h2 id="modal-title" class="text-2xl font-bold"></h2>
                            <span id="modal-sensitivity" class="inline-block px-2 py-1 rounded text-white text-sm mt-1"></span>
                        </div>
                        <button id="close-modal" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <h3 class="font-semibold text-gray-700">Description</h3>
                            <p id="modal-description" class="text-gray-600"></p>
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-700">Foreign Keys</h3>
                            <ul id="modal-fks" class="list-disc list-inside text-gray-600"></ul>
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-700">Example Queries</h3>
                            <div id="modal-queries" class="space-y-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // State
        let cy = null;
        let eventSource = null;
        const tables = new Map();

        // Initialize Cytoscape
        function initGraph() {
            cy = cytoscape({
                container: document.getElementById('live-graph'),
                style: [
                    {
                        selector: 'node',
                        style: {
                            'label': 'data(label)',
                            'text-valign': 'center',
                            'text-halign': 'center',
                            'background-color': '#6366f1',
                            'color': '#fff',
                            'text-outline-color': '#6366f1',
                            'text-outline-width': 2,
                            'font-size': '11px',
                            'width': 70,
                            'height': 70,
                        }
                    },
                    {
                        selector: 'node[sensitivity="PII"]',
                        style: { 'background-color': '#ef4444', 'text-outline-color': '#ef4444' }
                    },
                    {
                        selector: 'node[sensitivity="financial"]',
                        style: { 'background-color': '#f59e0b', 'text-outline-color': '#f59e0b' }
                    },
                    {
                        selector: 'node[sensitivity="internal"]',
                        style: { 'background-color': '#3b82f6', 'text-outline-color': '#3b82f6' }
                    },
                    {
                        selector: 'node[sensitivity="public"]',
                        style: { 'background-color': '#22c55e', 'text-outline-color': '#22c55e' }
                    },
                    {
                        selector: 'node.new',
                        style: { 'border-width': 4, 'border-color': '#fbbf24' }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 2,
                            'line-color': '#94a3b8',
                            'target-arrow-color': '#94a3b8',
                            'target-arrow-shape': 'triangle',
                            'curve-style': 'bezier',
                            'label': 'data(label)',
                            'font-size': '9px',
                            'text-rotation': 'autorotate',
                            'text-margin-y': -8,
                        }
                    },
                    {
                        selector: 'edge.new',
                        style: { 'line-color': '#fbbf24', 'target-arrow-color': '#fbbf24', 'width': 3 }
                    }
                ],
                layout: { name: 'preset' },
                minZoom: 0.3,
                maxZoom: 3,
            });

            // Node click handler
            cy.on('tap', 'node', (evt) => {
                const tableData = tables.get(evt.target.id());
                if (tableData) showModal(tableData);
            });
        }

        // Add table to graph
        function addTableToGraph(data) {
            // Store table data
            tables.set(data.table_name, data);

            // Remove 'new' class from previous nodes
            cy.nodes('.new').removeClass('new');
            cy.edges('.new').removeClass('new');

            // Add node if not exists
            if (cy.$(`#${data.table_name}`).length === 0) {
                cy.add({
                    data: {
                        id: data.table_name,
                        label: data.table_name,
                        sensitivity: data.sensitivity,
                    },
                    classes: 'new'
                });
            }

            // Add edges for foreign keys
            data.foreign_keys.forEach((fk, idx) => {
                const edgeId = `${data.table_name}-${fk.references_table}-${idx}`;
                if (cy.$(`#${edgeId}`).length === 0 && cy.$(`#${fk.references_table}`).length > 0) {
                    cy.add({
                        data: {
                            id: edgeId,
                            source: data.table_name,
                            target: fk.references_table,
                            label: `${fk.column} → ${fk.references_column}`,
                        },
                        classes: 'new'
                    });
                }
            });

            // Re-run layout
            cy.layout({
                name: 'cose',
                animate: true,
                animationDuration: 500,
                nodeRepulsion: 6000,
                idealEdgeLength: 80,
                fit: true,
                padding: 30,
            }).run();

            // Add to table list
            addTableToList(data);
        }

        // Add table to sidebar list
        function addTableToList(data) {
            const list = document.getElementById('table-list');
            
            // Remove placeholder
            if (list.querySelector('p')) {
                list.innerHTML = '';
            }

            const sensitivityColors = {
                'PII': 'bg-red-500',
                'financial': 'bg-amber-500',
                'internal': 'bg-blue-500',
                'public': 'bg-green-500',
            };

            const card = document.createElement('div');
            card.className = 'table-card p-3 border rounded-lg cursor-pointer hover:bg-gray-50';
            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <span class="font-medium">${data.table_name}</span>
                    <span class="px-2 py-0.5 rounded text-white text-xs ${sensitivityColors[data.sensitivity] || 'bg-gray-500'}">
                        ${data.sensitivity}
                    </span>
                </div>
                <p class="text-sm text-gray-600 mt-1 line-clamp-2">${data.description}</p>
            `;
            card.onclick = () => showModal(data);
            list.prepend(card);
        }

        // Show detail modal
        function showModal(data) {
            document.getElementById('modal-title').textContent = data.table_name;
            
            const sensitivityEl = document.getElementById('modal-sensitivity');
            sensitivityEl.textContent = data.sensitivity;
            sensitivityEl.className = `inline-block px-2 py-1 rounded text-white text-sm mt-1 sensitivity-${data.sensitivity}`;
            
            document.getElementById('modal-description').textContent = data.description;
            
            const fksList = document.getElementById('modal-fks');
            fksList.innerHTML = data.foreign_keys.length > 0
                ? data.foreign_keys.map(fk => `<li>${fk.column} → ${fk.references_table}.${fk.references_column}</li>`).join('')
                : '<li class="text-gray-400">No foreign keys</li>';
            
            const queriesDiv = document.getElementById('modal-queries');
            queriesDiv.innerHTML = data.example_queries.map(q => 
                `<pre class="bg-gray-100 p-2 rounded text-sm overflow-x-auto"><code>${q}</code></pre>`
            ).join('');
            
            document.getElementById('detail-modal').classList.remove('hidden');
            document.getElementById('detail-modal').classList.add('flex');
        }

        // Start cataloging
        async function startCataloging() {
            const btn = document.getElementById('start-btn');
            btn.disabled = true;
            btn.textContent = 'Starting...';
            btn.classList.add('opacity-50');

            try {
                const response = await fetch('/api/cataloging/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        host: 'postgres',
                        port: 5432,
                        database: 'northwind',
                        username: 'postgres',
                        password: 'postgres',
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to start cataloging');
                }

                const result = await response.json();
                console.log('Cataloging started:', result);

                // Show progress section
                document.getElementById('progress-section').classList.remove('hidden');
                document.getElementById('progress-count').textContent = `0 / ${result.total_tables}`;

                // Connect to SSE
                connectSSE();

            } catch (error) {
                alert('Error: ' + error.message);
                btn.disabled = false;
                btn.textContent = 'Start Cataloging';
                btn.classList.remove('opacity-50');
            }
        }

        // Connect to SSE stream
        function connectSSE() {
            if (eventSource) eventSource.close();

            eventSource = new EventSource('/api/progress');

            eventSource.addEventListener('table:cataloged', (e) => {
                const data = JSON.parse(e.data);
                console.log('Table cataloged:', data);
                
                // Update progress
                const percent = (data.index / data.total) * 100;
                document.getElementById('progress-bar').style.width = `${percent}%`;
                document.getElementById('progress-count').textContent = `${data.index} / ${data.total}`;
                document.getElementById('progress-text').textContent = `Cataloged: ${data.table_name}`;

                // Add to graph
                addTableToGraph(data);
            });

            eventSource.addEventListener('cataloging:completed', (e) => {
                const data = JSON.parse(e.data);
                console.log('Cataloging completed:', data);
                
                document.getElementById('progress-text').textContent = 
                    `Completed! ${data.total_tables} tables in ${data.duration_seconds.toFixed(1)}s`;
                document.getElementById('progress-bar').style.width = '100%';
                document.getElementById('progress-bar').classList.add('bg-green-500');
                
                const btn = document.getElementById('start-btn');
                btn.disabled = false;
                btn.textContent = 'Start Cataloging';
                btn.classList.remove('opacity-50');

                eventSource.close();
            });

            eventSource.addEventListener('heartbeat', (e) => {
                const data = JSON.parse(e.data);
                if (data.status === 'processing' && data.current_table) {
                    document.getElementById('progress-text').textContent = `Processing: ${data.current_table}...`;
                }
            });

            eventSource.onerror = () => {
                console.error('SSE connection error');
            };
        }

        // Reset
        async function resetCataloging() {
            if (eventSource) eventSource.close();
            
            await fetch('/api/cataloging/reset', { method: 'POST' });
            
            // Clear graph
            cy.elements().remove();
            tables.clear();
            
            // Reset UI
            document.getElementById('table-list').innerHTML = `
                <p class="text-gray-500 text-center py-8">
                    Click "Start Cataloging" to begin
                </p>
            `;
            document.getElementById('progress-section').classList.add('hidden');
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('progress-bar').classList.remove('bg-green-500');
            
            const btn = document.getElementById('start-btn');
            btn.disabled = false;
            btn.textContent = 'Start Cataloging';
            btn.classList.remove('opacity-50');
        }

        // Event listeners
        document.getElementById('start-btn').addEventListener('click', startCataloging);
        document.getElementById('reset-btn').addEventListener('click', resetCataloging);
        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('detail-modal').classList.add('hidden');
            document.getElementById('detail-modal').classList.remove('flex');
        });
        document.getElementById('detail-modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('detail-modal').classList.add('hidden');
                document.getElementById('detail-modal').classList.remove('flex');
            }
        });

        // Initialize
        initGraph();
    </script>
</body>

</html>
